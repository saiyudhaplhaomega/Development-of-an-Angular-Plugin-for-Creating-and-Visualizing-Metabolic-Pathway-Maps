<div class="flex flex-col h-full">
  <mat-toolbar color="primary" class="flex-shrink-0">
    <!-- application name and navigation to landing page -->
    <button mat-flat-button color="primary" routerLink="homeLink">
      <span> {{ applicationName }} </span>
    </button>

    <!-- links for navigation -->
    <ng-container *ngFor="let link of visibleLinks">
      <ng-container *ngIf="link.route; then simpleLink; else nestedLinks">
      </ng-container>

      <!-- simple links without nesting -->
      <ng-template #simpleLink>
        <button color="primary" mat-flat-button [routerLink]="link.route">
          <span>
            {{ link.label }}
          </span>
        </button>
      </ng-template>

      <!-- nested links -->
      <ng-template #nestedLinks>
        <button [matMenuTriggerFor]="menu" color="primary" mat-flat-button>
          <span>
            {{ link.label }}
          </span>
        </button>

        <mat-menu #menu="matMenu">
          <ng-container *ngFor="let childLink of link.children">
            <button mat-menu-item [routerLink]="childLink.route">
              {{ childLink.label }}
            </button>
          </ng-container>
        </mat-menu>
      </ng-template>
    </ng-container>

    <!-- login button -->
    <div *ngIf="true" class="ml-auto">
      <button mat-flat-button color="primary">
        Log in
        <mat-icon>account_circle</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <!-- application content -->
  <div class="flex flex-col h-full overflow-y-auto">
    <div class="overflow-y-auto">
      <ng-content select="router-outlet"></ng-content>
    </div>
    <div class="mt-auto">
      <ng-content select="#footer"></ng-content>
    </div>
  </div>
</div>
