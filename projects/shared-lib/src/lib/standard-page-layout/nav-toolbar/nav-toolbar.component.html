<div class="flex flex-col h-full">
  <mat-toolbar class="nav-toolbar-root flex-shrink-0 header-color">
    <!-- application name and navigation to landing page -->
    <button class="toolbar-button" mat-flat-button routerLink="homeLink">
      <span class="header-tool-name"> {{ applicationName }} </span>
    </button>

    <!-- links for navigation -->
    <ng-container *ngFor="let link of visibleLinks">
      <!-- content is inserted depending on condition: https://angular.io/api/core/ng-container -->
      <ng-container *ngIf="link.route; then simpleLink; else nestedLinks">
      </ng-container>

      <!-- simple links without nesting -->
      <ng-template #simpleLink>
        <button
          class="toolbar-button"
          mat-flat-button
          [routerLink]="link.route"
        >
          <span>
            {{ link.label }}
          </span>
        </button>
      </ng-template>

      <!-- nested links with menu -->
      <ng-template #nestedLinks>
        <button
          class="toolbar-button"
          [matMenuTriggerFor]="menu"
          mat-flat-button
        >
          <span>
            {{ link.label }}
          </span>
        </button>

        <mat-menu #menu="matMenu">
          <ng-container *ngFor="let childLink of link.children">
            <button mat-menu-item [routerLink]="childLink.route">
              {{ childLink.label }}
            </button>
          </ng-container>
        </mat-menu>
      </ng-template>
    </ng-container>

    <!-- login button -->
    <div *ngIf="hasLogin" class="ml-auto" [routerLink]="'/login'">
      <button mat-flat-button>
        Log in
        <mat-icon>account_circle</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <!-- application content is projected into router and footer slots: https://angular.io/guide/content-projection -->
  <div class="flex flex-col h-full overflow-y-auto">
    <div class="overflow-y-auto">
      <!-- router slot -->
      <ng-content select="router-outlet"></ng-content>
    </div>
    <div class="mt-auto">
      <!-- footer slot -->
      <ng-content select="#footer"></ng-content>
    </div>
  </div>

</div>
