<mat-toolbar color="primary">
  <mat-toolbar-row>
    <!--div fxLayout="row" fxLayoutGap="20px" fxLayoutAlign="center center" *ngIf="user"-->
    <div fxLayout="row" fxLayoutGap="20px" fxLayoutAlign="space-around center">
      <span *ngIf="homelink===null">
        <span class="small-margin-right">{{applicationname}}</span>
      </span>
      <span *ngIf="homelink!==null">
        <button mat-button (click)="navigate(homelink.route)">
          <span class="small-margin-right">{{applicationname}}</span>
        </button>
      </span>
      <span *ngFor="let link of routerlinks">
        <ng-container *ngIf="checkAuthOnLink(link)">
          <button mat-button (click)="navigate(link.route)">{{link.label}}</button>
        </ng-container>
      </span>
    </div>
    <div class="spacer"></div>
    <div *ngIf="!user; else elseBlock">
      <button mat-icon-button (click)="navigate('/login')">
        <mat-icon aria-label="account menu icon">account_circle</mat-icon>
      </button>
    </div>
    <ng-template #elseBlock>
      <button mat-icon-button (click)="navigate('/login')">
        <img src="{{ user.picture }}" />
      </button>
    </ng-template>
    <button mat-button (click)="authService.logout()" *ngIf="user || guest">
      Log out
    </button>
    <button mat-button (click)="navigate('login')" *ngIf="!user && !guest">
      Log in
    </button>
    <span class="small-margin-right"></span>
  </mat-toolbar-row>
</mat-toolbar>
