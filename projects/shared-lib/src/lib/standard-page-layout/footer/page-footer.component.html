<div class="footer p-4">
  <ng-container *ngFor="let category of footercontent">
    <ul>
      <li>{{category.categoryname}}</li>
      <ng-container *ngFor="let element of category.elements">
        <li>
          <ng-container *ngIf="element.href==undefined && element.routerlink==undefined">
            {{element.name}}
          </ng-container>
          <ng-container *ngIf="element.href!=undefined">
            <a href="{{element.href}}">{{element.name}}</a>
          </ng-container>
          <ng-container *ngIf="element.href==undefined && element.routerlink!=undefined">
            <a [routerLink]="[element.routerlink]">{{element.name}}</a>
          </ng-container>
        </li>
      </ng-container>
    </ul>
  </ng-container>
</div>
