<div class="input-group mb-3">
  <div class="input-group-prepend">
    <span class="input-group-text">{{labels.inputGroupLabel}}</span>
  </div>
  <div class="custom-file">
    <input type="file" [accept]="inputType" class="custom-file-input" id="mpa" #selection
           (change)="onFileChange(selection.files)"
           class="custom-file-input">
    <label *ngIf="!selectedFile"
           class="custom-file-label"
           for="mpa">
      {{labels.inputLabel}}
    </label>
    <label *ngIf="selectedFile"
           class="custom-file-label"
           for="mpa">
      {{selectedFile.name}}
    </label>
  </div>
</div>
