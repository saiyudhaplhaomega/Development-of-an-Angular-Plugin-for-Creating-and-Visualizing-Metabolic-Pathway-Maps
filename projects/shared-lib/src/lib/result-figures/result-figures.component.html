<div class="h-full">
  <ng-template [ngIf]="imageLinks?.length > 1 && !isLoading">
    <mat-tab-group
      class="h-full"
      mat-stretch-tabs="true"
      mat-align-tabs="center"
      animationDuration="1000ms"
    >
      <mat-tab *ngFor="let image of imageLinks; let i = index">
        <ng-template mat-tab-label> {{ tabLables[i] }} </ng-template>
        <div class="centereing-container">
          <!-- <img class="w-full h-full object-contain min-h-0" [src]="image" /> -->
          <object type="text/html" [data]=" image | safe "width="800px" height="600px" style="overflow:auto">
          </object>
        </div>
      </mat-tab>
    </mat-tab-group>
  </ng-template>

  <div
    *ngIf="imageLinks?.length === 1 && !isLoading"
    class="centereing-container"
  >
    <span class="mat-tab-label mat-tab-label-content">
      {{ tabLables[0] }}
    </span>
    <object type="text/html" [data]=" imageLinks[0] | safe "width="800px" height="600px" style="overflow:auto">
    </object>
    <!--<img class="w-full h-full object-contain min-h-0" [src]="imageLinks[0]" />-->
  </div>

  <div
    class="centereing-container"
    *ngIf="isLoading && imageLinks?.length === 0"
  >
    <mat-spinner></mat-spinner>
  </div>

  <div
    *ngIf="imageLinks?.length === 0 && !isLoading"
    class="centereing-container"
  >
    <p>no data yet, please submit an input</p>
  </div>
</div>
