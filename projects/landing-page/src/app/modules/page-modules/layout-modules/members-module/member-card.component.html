<div class="member-card">
  <div class="description-container">
    <h1>{{ member.name }}</h1>
    <h2>{{ member.role }}</h2>
    <h2>{{ member.email }}</h2>
    <h2>{{ member.email2 }}</h2>
    <h2>Projects: {{ member.projects }}</h2>
    <h2>{{ member.projects2 }}</h2>
  </div>
  <img src="{{ member.picture }}" alt="{{ member.name }}'s picture" />
</div>
