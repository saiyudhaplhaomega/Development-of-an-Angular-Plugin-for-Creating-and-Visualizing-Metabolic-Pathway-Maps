<div class="horizontal-scroll-container">
  <div class="tool-card">
    <div class="GridWrapper">
      <div class="ImageWrapper" (click)="goToLink(toolData.link)">
        <img [src]="toolData.imageSrc" alt="{{ toolData.title }}" />
      </div>
      <div class="Description">
        <h3 class="Title">{{ toolData.title }}</h3>
        <p class="Text">{{ toolData.description }}</p>
      </div>
    </div>
  </div>
</div>
