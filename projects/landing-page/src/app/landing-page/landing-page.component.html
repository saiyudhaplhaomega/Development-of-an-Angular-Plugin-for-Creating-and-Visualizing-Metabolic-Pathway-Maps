<div id="scroll-container">
  <div id="header">
    <app-background></app-background>
    <h1>Multi-Dimensional Omics Toolbox</h1>
    <p>Welcome to a world of versatile tools for all your needs.</p>
  </div>

  <div id="section1" class="section">
        <h1>Our Metaproteomics Tools</h1>
            <div class="horizontal-scroll-container image-grid">
              <tool-card *ngFor="let tool of tools" [toolData]="tool"></tool-card>
            </div>
  </div>

  <div id="section2" class="section">
      <div class="update-list grid-right">
        <div class="transparent-box">
          <h1>News Feed</h1>
          <update-list [updates]="updateList"></update-list>
        </div>
      </div>
</div>
