<section class="tool-overview">
  <h1>{{ toolName }}</h1>
  <div class="tool-details">
    <div class="logo-container">
      <img [src]="toolLogo" alt="Tool Logo" />
    </div>
    <div class="tool-description">
      <p>{{ toolDescription }}</p>
    </div>
  </div>
  <h2>Details</h2>
  <!-- <div class="details-container"> -->
    <h3>Inputs and Outputs</h3>

    <table mat-table [dataSource]="inputsOutputs" class="mat-elevation-z8">

      <!-- Inputs Column -->
      <ng-container matColumnDef="inputs">
        <th mat-header-cell *matHeaderCellDef>Inputs</th>
        <td mat-cell *matCellDef="let element">
          <ng-container *ngFor="let input of element.inputs">
            <div>{{ input }}</div>
          </ng-container>
        </td>
      </ng-container>

      <!-- Outputs Column -->
      <ng-container matColumnDef="outputs">
        <th mat-header-cell *matHeaderCellDef>Outputs</th>
        <td mat-cell *matCellDef="let element">
          <ng-container *ngFor="let output of element.outputs">
            <div>{{ output }}</div>
          </ng-container>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['inputs', 'outputs']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['inputs', 'outputs']"></tr>
    </table>

    <h3>Developers:</h3>
    <ul>
      <li *ngFor="let developer of developers">
        <a [href]="developer.link">
          {{ developer.name }} - {{ developer.email }}
        </a>
      </li>
    </ul>
  <!-- </div> -->
  <p class="tool-about"></p>
  <button mat-raised-button color="primary" [routerLink]="backLink">{{ backLinkText }}</button>
</section>
