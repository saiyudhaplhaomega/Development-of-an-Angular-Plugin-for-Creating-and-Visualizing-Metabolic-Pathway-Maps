<div class="custom-tab-box">
    <div class="flexbox-column protein-table">
        <div style="display: flex; display: flex; justify-content: space-between">
            <mat-form-field>
                <input matInput (keyup)="applyFilter()" placeholder="Filter" [(ngModel)]="filterString">
            </mat-form-field>
        </div>
        <div style="overflow-y: auto; height: 100%" class="table-border">
            <table mat-table style="width: 100%" [dataSource]="dataSource" multiTemplateDataRows>

                <ng-container matColumnDef="functionID">
                    <th mat-header-cell *matHeaderCellDef>ID</th>
                    <td mat-cell *matCellDef="let row">{{row.id}}</td>
                </ng-container>

                <ng-container matColumnDef="idType">
                    <th mat-header-cell *matHeaderCellDef>ID Type</th>
                    <td mat-cell *matCellDef="let row">{{row.type}}</td>
                </ng-container>

                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef>Description</th>
                    <td mat-cell *matCellDef="let row">{{row.description}}</td>
                </ng-container>

                <ng-container matColumnDef="quantification">
                    <th mat-header-cell *matHeaderCellDef>Quantification</th>
                    <td mat-cell *matCellDef="let row">1312</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="onClick(row)" class="table-element-row" [ngClass]="{
                    'table-highlight-row': row.id == selectedFunctionRow.id
                }">
                </tr>
            </table>
            <mat-paginator #paginator style="background: none;" [pageSizeOptions]="[5,10,25,100]" pageSize="5"
                showFirstLastButtons></mat-paginator>
        </div>
    </div>
