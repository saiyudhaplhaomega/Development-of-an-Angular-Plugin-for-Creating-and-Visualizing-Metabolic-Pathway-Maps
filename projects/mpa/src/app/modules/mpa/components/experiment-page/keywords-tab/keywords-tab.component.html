<div style="min-height: 300px;" class="keywords-tab">
    <div class="keywords-tab-options">
        <mat-form-field style="width: 20%; margin-right: 15px;">
            <input matInput placeholder="Filter" (keyup)="applyFilter()" [(ngModel)]="filterString">
        </mat-form-field>
        <div>
            <button mat-button (click)="expandAll()">Expand all</button>
            <button mat-button (click)="collapseAll()">Collapse all</button>
        </div>
    </div>
    <mat-accordion multi>
        <ng-container *ngFor="let key of this.keyArray">
            <mat-expansion-panel class="keyword-category">
                <mat-expansion-panel-header class="keyword-category-header">
                    {{key.toString()}}
                </mat-expansion-panel-header>
                <ng-template matExpansionPanelContent>
                    <ul class="keyword-list">
                        <li class="keyword-row-header keyword-row">
                            <span>Description</span>
                            <span>Quantification</span>
                        </li>
                        <li *ngFor="let keyword of this.dataMap.get(key)" class="keyword-row" [ngClass]="{'keyword-row-selected': keyword.description == selectedKeyword}"
                            (click)="keywordClicked(keyword)">
                            <span>{{keyword.description}}</span>
                            <span>765</span>
                        </li>
                    </ul>
                </ng-template>
            </mat-expansion-panel>
        </ng-container>
    </mat-accordion>
    <ng-container *ngIf="!(this.keyArray.length > 0)">
        <p>No matching data found!</p>
    </ng-container>
</div>
