<div>
  <div class="jobCards" style="width: 100%; margin-bottom: 8px;">
    <div class="card min-w-600">
      <div class="card-header custom-card-header">
        <h2>Folder: {{this.dataItemOfThisComponent.displayName}} <button style="background: none; border: none"
            (click)="onSetName()">(edit)</button></h2>
        <button class="btn btn-outline-danger w-sbtn" matTooltip="Delete folder" (click)='onRemoveFolder()'><mat-icon
            style="display: flex; justify-content: center">close</mat-icon></button>
      </div>

      <div class="card-body">
        <!-- <div class="input-group mb-3 ng-star-inserted" style="min-width:80%;">
          <div class="input-group-prepend">
            <span class="input-group-text">Folder Name</span>
          </div>
          <input type="text" class="form-control" [(ngModel)]="this.dataItemOfThisComponent.displayName">
          <div class="input-group-append">
            <button class="btn btn-outline-secondary w-sbtn" style="display: flex; justify-content: center"
              aria-label="Accept" (click)="onAcceptNameChange()">
              <mat-icon>done</mat-icon>
            </button>
          </div>
        </div> -->
        <div style="display:flex; flex-direction: row; width: 100%;">
          <div style="width: 80%;">
            <table class="table table-light table-hover" style="margin-bottom:0px;">
              <thead>
              </thead>
              <tbody>
                <tr>
                  <th scope="row" class="ml-summary-col">Experiments</th>
                  <td>
                    <ng-container *ngIf="experiments.length !== 0">
                      <p>{{experiments}}</p>
                    </ng-container>
                    <ng-container *ngIf="experiments.length === 0">
                      <p>No Experiments</p>
                    </ng-container>
                  </td>
                </tr>
                <tr>
                  <th scope="row" class="ml-summary-col">Protein Data Bases</th>
                  <td>
                    <ng-container *ngIf="protdbs.length !== 0">
                      <p>{{protdbs}}</p>
                    </ng-container>
                    <ng-container *ngIf="protdbs.length === 0">
                      <p>No Data Bases</p>
                    </ng-container>
                  </td>
                </tr>
                <tr>
                  <th scope="row" class="ml-summary-col">Subfolders</th>
                  <td>
                    <ng-container *ngIf="subfolders.length !== 0">
                      <p>{{subfolders}}</p>
                    </ng-container>
                    <ng-container *ngIf="subfolders.length === 0">
                      <p>No Subfolders</p>
                    </ng-container>
                  </td>
                </tr>
                <tr>
                  <th scope="row" class="ml-summary-col">Description:
                    <button style="background: none; border: none" (click)="onSetDescription()">(edit)</button>
                  </th>
                  <td>
                    {{this.folder.description}}
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div style="flex-shrink: 0;">
            <table class="table" style="border: #fff;">
              <!-- use table to align buttons with rows, delete all styling, except dynamic height-->
              <thead>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <button class="btn btn-primary rki-blue-bg" (click)='onAddExperiment()' style="width: 100%;">
                      Add Experiment
                    </button>
                  </td>
                </tr>
                <tr>
                  <td>
                    <button class="btn btn-primary rki-blue-bg" (click)='onAddProteinDatabase()' style="width: 100%;">
                      Add ProtDB
                    </button>
                  </td>
                </tr>
                <tr>
                  <td>
                    <button class="btn btn-primary rki-blue-bg" (click)='onAddFolder()' style="width: 100%;">
                      Add Folder
                    </button>
                  </td>
                </tr>
                <tr>
                  <td>
                    <button class="btn btn-primary rki-blue-bg" (click)='onAddComparison()'>Add Comparison</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>
      </div>
    </div>
  </div>

    <div class="jobCards" style="width: 100%" [@detailExpand]="intentToAddExperiment ? 'expanded' : 'collapsed'">
      <div class="card min-w-600">
        <div class="card-header custom-card-header">
          <h2>Add Experiments</h2>
        </div>
        <div class="card-body">
          <app-file-upload [parentDataItem]="this.dataItemOfThisComponent"></app-file-upload>
        </div>
      </div>
    </div>
</div>
