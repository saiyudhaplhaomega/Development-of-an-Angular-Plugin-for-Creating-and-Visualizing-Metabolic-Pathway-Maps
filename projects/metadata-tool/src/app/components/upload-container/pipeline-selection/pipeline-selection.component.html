<mat-grid-list cols="3" rowHeight="2:1">
  <mat-grid-tile colspan="2">
    <div style="display: flex; align-items: center; width: 100%;">
      <mat-form-field appearance="fill"  style="width: 30%;">
        <mat-label>{{ label }}</mat-label>
        <mat-select
          flex
          [(ngModel)]="selectedPipeline"
          (ngModelChange)="onValueChange($event)"
        >
          <mat-option *ngFor="let entry of entries" [value]="entry">
            {{ entry.viewValue }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div style="width: 40%;">
        supports files with an {{ selectedPipeline.acceptedDataTypes.join(' and ') }} extension.
      </div>
    </div>
  </mat-grid-tile>
</mat-grid-list>
