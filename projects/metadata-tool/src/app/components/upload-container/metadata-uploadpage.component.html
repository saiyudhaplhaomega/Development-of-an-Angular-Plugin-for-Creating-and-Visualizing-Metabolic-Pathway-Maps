
<div class="progress-container">
  <mat-progress-bar
   *ngIf="uploadProgress  > 0"
    #progressBar
    mode="determinate"
    [value]="uploadProgress"
    [matTooltip]="timeRemaining"
    matTooltipPosition="above"
    (mouseover)="showTooltip(progressBar)"
    (mouseout)="hideTooltip(progressBar)">
  </mat-progress-bar>
</div>

<div class="pipeline-selection-container">
  <mat-form-field appearance="fill">
    <mat-label>Choose Pipeline</mat-label>
    <mat-select [(ngModel)]="selectedPipeline">
      <mat-option *ngFor="let pipeline of pipelines" [value]="pipeline">
        {{ pipeline.viewValue }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>

<div class="upload-container" *ngIf="showContainer" (dragover)="onDragOver($event)" (drop)="onDrop($event)">
<div class="header-container">
    <h2 class="upload-title">File Upload</h2>
    <button class="file-chooser-button" (click)="fileInput.click()">
      <mat-icon>upload</mat-icon>
    </button>
  </div>

  <div class="selected-files-box" *ngIf="selectedFiles.length > 0">
  <ul>`
    <li *ngFor="let file of selectedFiles; let i = index" class="file-item">
      <span class="file-name">{{ file.name }}</span>
      <button mat-mini-fab color="warn" (click)="deleteFile(i)" class="delete-button">
        <mat-icon>delete</mat-icon>
      </button>
    </li>
  </ul>
</div>

 <div class="file-upload-container">
  <!-- This input element is hidden! -->
  <input
    #fileInput
    type="file"
    [accept]="selectedPipeline.acceptedDataTypes"
    multiple
    (change)="onFilesSelected($event)"
    style="display: none;"
  />


</div>

<div *ngIf="selectedFiles.length == 0">
  <div class="drag-drop-text">
    Drag and Drop Files here
  </div>
  <div>
    Files must have an {{selectedPipeline.acceptedDataTypes}} extension.
  </div>
</div>

  <button  *ngIf="selectedFiles.length > 0" (click)="onUpload()">Upload</button>
