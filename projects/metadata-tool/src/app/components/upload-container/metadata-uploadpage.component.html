
<div class="progress-container">
  <mat-progress-bar
   *ngIf="uploadProgress  > 0"
    #progressBar
    mode="determinate"
    [value]="uploadProgress"
    [matTooltip]="timeRemaining"
    matTooltipPosition="above"
    (mouseover)="showTooltip(progressBar)"
    (mouseout)="hideTooltip(progressBar)">
  </mat-progress-bar>
</div>

<div class="pipeline-selection-container">
  <mat-form-field appearance="fill">
    <mat-label>Choose Pipeline</mat-label>
    <mat-select [(ngModel)]="selectedPipeline">
      <mat-option *ngFor="let pipeline of pipelines" [value]="pipeline.value">
        {{ pipeline.viewValue }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>

{{selectedPipeline}}

<div class="upload-container" *ngIf="showContainer" (dragover)="onDragOver($event)" (drop)="onDrop($event)">
  <!-- Display metadataUploadJson data -->
  <h2 class="upload-title">File Upload</h2>
  <div class="selected-files-box" *ngIf="selectedFiles.length > 0">
  <ul>`
    <li *ngFor="let file of selectedFiles; let i = index" class="file-item">
      <span class="file-name">{{ file.name }}</span>
      <button mat-mini-fab color="warn" (click)="deleteFile(i)" class="delete-button">
        <mat-icon>delete</mat-icon>
      </button>
    </li>
  </ul>
</div>

 <div class="file-upload-container">
  <button class="file-chooser-button" (click)="fileInput.click()">Choose Files</button>
  <input
    #fileInput
    type="file"
    accept="*/*"
    multiple
    (change)="onFilesSelected($event)"
    style="display: none;"
  />
  <button class="upload-button" *ngIf="selectedFiles.length > 0" (click)="onUpload()">Upload</button>
</div>
