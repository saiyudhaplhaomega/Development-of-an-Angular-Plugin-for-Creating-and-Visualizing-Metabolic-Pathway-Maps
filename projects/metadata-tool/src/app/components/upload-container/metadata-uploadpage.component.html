<mat-vertical-stepper [linear]="true" #stepper>
  <!-- Step 1: Pipeline Selection -->
  <mat-step [stepControl]="firstFormGroup">
    <ng-template matStepLabel>Choose Pipeline</ng-template>
    <app-pipeline-selection
      [(ngModel)]="selectedPipeline"
      [entries]="pipelines"
      label="Choose Pipeline"
      (ngModelChange)="firstStepCompleted = !!$event"
    >
    </app-pipeline-selection>
  </mat-step>

  <!-- Step 2: File Upload -->
  <mat-step
    [stepControl]="secondFormGroup"
    [completed]="firstStepCompleted && secondStepCompleted"
  >
    <ng-template matStepLabel>Upload Files</ng-template>
    <app-file-upload
      [acceptedDataTypes]="selectedPipeline.acceptedDataTypes"
      [acceptedFileRegex]="selectedPipeline.matchingFilesReges"
      (filesSelected)="handleFileSelection($event); secondStepCompleted = true"
    >
    </app-file-upload>
  </mat-step>

  <!-- Step 3: Metadata Questions -->
  <mat-step [stepControl]="thirdFormGroup" [completed]="uploadTriggered">
    <ng-template matStepLabel>Metadata Questions</ng-template>
    <app-metadata-quest></app-metadata-quest>
  </mat-step>
</mat-vertical-stepper>
