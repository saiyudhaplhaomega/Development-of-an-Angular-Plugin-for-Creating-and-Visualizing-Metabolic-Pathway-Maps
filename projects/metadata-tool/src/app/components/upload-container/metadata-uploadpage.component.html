<div>
    <mat-progress-bar mode="determinate" [value]="uploadProgress"></mat-progress-bar>
    <p>Time remaining: {{ timeRemaining }}</p>
</div>
<div class="upload-container" *ngIf="showContainer">
  <h2 class="upload-title">File Upload</h2>

  <input
    class="upload-input"
    type="file"
    accept=".*"
    multiple
    (change)="onFilesSelected($event)"
  />
  <div class="selected-files-box" *ngIf="selectedFiles.length > 0">
  <h3>Selected Files:</h3>
  <ul>
    <li *ngFor="let file of selectedFiles; let i = index">
      {{ file.name }}
      <button mat-mini-fab color="warn" (click)="deleteFile(i)">
        <mat-icon>delete</mat-icon>
      </button>
    </li>
  </ul>
</div>
  <button class="upload-button" (click)="onUpload()">Upload</button>
