<div class="file-upload-container"
     (dragover)="onDragOver($event)"
     (dragleave)="onDragLeave($event)"
     (drop)="onDrop($event)"
     [class.drag-over]="isDragOver">

    <!-- Drag and Drop Instruction Text -->
    <div *ngIf="selectedFiles.length == 0" class="drag-drop-text">
        Drag and Drop Files Here
        <div>Files must have an {{acceptedDataTypes}} extension.</div>
    </div>

    <!-- File Input Button -->
    <button class="file-chooser-button" (click)="fileInput.click()">
        <mat-icon>upload</mat-icon> Choose Files
    </button>
    <input #fileInput
           type="file"
           [accept]="acceptedDataTypes"
           multiple
           (change)="onFilesSelected($event)"
           style="display: none;">

    <!-- List of Selected Files -->
    <div class="selected-files-box" *ngIf="selectedFiles.length > 0">
        <ul>
            <li *ngFor="let file of selectedFiles; let i = index" class="file-item">
                <span class="file-name">{{ file.name }}</span>
                <button mat-mini-fab color="warn" (click)="deleteFile(i)" class="delete-button">
                    <mat-icon>delete</mat-icon>
                </button>
            </li>
        </ul>
    </div>
</div>
