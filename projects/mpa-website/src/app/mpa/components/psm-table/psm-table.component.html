<div class="flexbox-column">
  <div>
    <mat-form-field>
      <input matInput (keyup)="applyFilter($event)" placeholder="Filter" />
    </mat-form-field>
  </div>

  <div style="height: 100%; overflow-y: auto" class="table-border">
    <mat-table [dataSource]="dataSource" matSort>
      <!-- Peptide Count Column -->
      <ng-container matColumnDef="psmID">
        <mat-header-cell *matHeaderCellDef mat-sort-header>
          PSM id</mat-header-cell
        >
        <mat-cell *matCellDef="let row"> {{ row.psmID }} </mat-cell>
      </ng-container>

      <ng-container matColumnDef="peptideID">
        <mat-header-cell *matHeaderCellDef mat-sort-header>
          peptide id</mat-header-cell
        >
        <mat-cell *matCellDef="let row"> {{ row.peptideID }} </mat-cell>
      </ng-container>

      <ng-container matColumnDef="spectrumID">
        <mat-header-cell *matHeaderCellDef mat-sort-header>
          spectrum id</mat-header-cell
        >
        <mat-cell *matCellDef="let row"> {{ row.spectrumID }} </mat-cell>
      </ng-container>

      <mat-header-row
        *matHeaderRowDef="displayedColumns; sticky: true"
      ></mat-header-row>
      <mat-row
        *matRowDef="let row; columns: displayedColumns"
        (click)="setPsm(row)"
        [ngClass]="{
          'table-highlight-row': highlightRow(row),
          'table-element-row': !highlightRow(row)
        }"
      >
      </mat-row>
    </mat-table>
  </div>

  <div style="display:flex;flex-direction: row; justify-content: space-between;flex-wrap: nowrap;align-items: center;">
    <button *ngIf=" scope != PsmScope.singlePeptide" class="btn btn-primary rki-blue-bg protein-table-button" style="width: 18%; height: 55%; margin-right:1%;">Export</button>
  <mat-paginator
    [pageSizeOptions]="[5, 10, 25, 100]"
    showFirstLastButtons
  ></mat-paginator>
  </div>
</div>
