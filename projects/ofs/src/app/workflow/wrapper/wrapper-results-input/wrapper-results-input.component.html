<div>
  <mat-form-field appearance="outline">
    <mat-label>profile selection</mat-label>
    <mat-select [formControl]="profileSelection">
      <mat-option *ngFor="let option of listOfFeatureProfiles" [value]="option">
        {{ option.profileId }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-flat-button (click)="applyFeatureProfile()" color="primary">
    apply feature profile to selection
  </button>
</div>

<mat-form-field appearance="outline">
  <mat-label>Filter</mat-label>
  <input
    matInput
    (keyup)="applyFilter($event)"
    placeholder="find feature"
    #input
  />
</mat-form-field>

<table mat-table matSort [dataSource]="dataSource" class="w-full">
  <ng-container matColumnDef="select">
    <th mat-header-cell *matHeaderCellDef>
      <mat-checkbox
        (change)="$event ? toggleAllRows() : null"
        [checked]="selection.hasValue() && isAllSelected()"
        [indeterminate]="selection.hasValue() && !isAllSelected()"
      >
      </mat-checkbox>
    </th>
    <td mat-cell *matCellDef="let row">
      <mat-checkbox
        (click)="$event.stopPropagation()"
        (change)="$event ? selection.toggle(row.featureId) : null"
        [checked]="selection.isSelected(row.featureId)"
      >
      </mat-checkbox>
    </td>
  </ng-container>

  <ng-container matColumnDef="featureId">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>feature id</th>
    <td mat-cell *matCellDef="let feature">{{ feature.featureId }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns"
    (click)="selection.toggle(row.featureId)"
  ></tr>

  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" colspan="2">
      No data matching the filter "{{ input.value }}"
    </td>
  </tr>
</table>

<mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>

<button mat-flat-button (click)="generateResults()" color="primary">
  submit features and retrieve results
</button>
