<form [formGroup]="formModel" class="flex flex-col">
  <mat-form-field appearance="outline">
    <mat-label>control group</mat-label>
    <mat-select formControlName="controlGroup">
      <mat-option>
        {{ controlGroupName }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>test group</mat-label>
    <mat-select formControlName="testGroup">
      <mat-option *ngFor="let option of testGroupOptions" [value]="option">
        {{ option }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-16">
    <mat-label>repeats</mat-label>
    <input type="number" matInput formControlName="repeats" />
    <mat-error *ngIf="formModel.get('repeats').invalid">{{
      getErrorMessage(formModel.get("repeats"))
    }}</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-16">
    <mat-label>folds</mat-label>
    <input type="number" matInput formControlName="folds" />
    <mat-error *ngIf="formModel.get('folds').invalid">{{
      getErrorMessage(formModel.get("folds"))
    }}</mat-error>
  </mat-form-field>

  <button [disabled]="!formModel.valid" mat-flat-button color="primary">
    submit data
  </button>
</form>
