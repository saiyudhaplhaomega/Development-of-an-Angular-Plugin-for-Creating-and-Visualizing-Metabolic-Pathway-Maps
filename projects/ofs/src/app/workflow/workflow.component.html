<div class="max-w-screen-2xl mx-auto p-4">
  <mat-card>
    <mat-card-content>
      <mat-stepper
        [linear]="true"
        #stepper
        (selectionChange)="setStep($event.selectedIndex)"
        [selectedIndex]="(currentStep$ | async).index"
      >
        <mat-step
          *ngFor="let step of steps; let i = index"
          [completed]="(completedSteps$ | async)[i]"
          [editable]="true"
        >
          <ng-template matStepLabel>{{ step.label }}</ng-template>
        </mat-step>
      </mat-stepper>

      <div class="flex flex-row justify-between">
        <button mat-button (click)="prevStep()" [disabled]="!allowPrev">
          previous step
        </button>
        <button mat-button (click)="nextStep()" [disabled]="!allowNext">
          next step
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
