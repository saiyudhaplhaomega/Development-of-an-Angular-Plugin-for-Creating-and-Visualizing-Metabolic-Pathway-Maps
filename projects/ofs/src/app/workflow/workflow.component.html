<!-- {{ OFSData | json }} -->

<div class="flex flex-col h-full">
  <div class="stepper-container mx-auto p-4 flex-grow-0 flex-shrink-0">
    <mat-card>
      <mat-card-content>
        <mat-stepper
          [linear]="true"
          #stepper
          (selectionChange)="setStep($event.selectedIndex)"
          [selectedIndex]="(currentStep$ | async).index"
        >
          <mat-step
            *ngFor="let step of steps; let i = index"
            [completed]="(completedSteps$ | async)[i]"
            [editable]="true"
          >
            <ng-template matStepLabel>{{ step.label }}</ng-template>
          </mat-step>
        </mat-stepper>

        <div class="flex flex-row justify-between">
          <button mat-button (click)="prevStep()" [disabled]="!allowPrev">
            previous step
          </button>
          <button mat-button (click)="nextStep()" [disabled]="!allowNext">
            next step
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <div class="workflow-container">
    <!-- <div style="width: 1536px"></div> -->

      <ofs-carousel>
        <ng-container *ofsCarouselItem>
          <div class="w-20 h-20 bg-slate-400">Käse</div>
        </ng-container>
        <ng-container *ofsCarouselItem
          ><div class="w-20 h-20 bg-slate-400">Wurst</div>
        </ng-container>
        <ng-container *ofsCarouselItem>
          <div class="w-20 h-20 bg-slate-400">Brot</div>
        </ng-container>
      </ofs-carousel> -->

    <mat-card class="workflow-card">
      <mat-card-header>
        <mat-card-title>
          {{ (currentStep$ | async).label }}
        </mat-card-title>
      </mat-card-header>
      <mat-card-content class="workflow-card-content">
        <router-outlet></router-outlet>
      </mat-card-content>
    </mat-card>
  </div>
</div>
