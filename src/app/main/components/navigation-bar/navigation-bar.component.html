<mat-toolbar color="primary">
  <mat-toolbar-row>

    <div fxLayout="row" fxLayoutGap="20px" fxLayoutAlign="center center" *ngIf="user">
      <span>MPA-Cloud</span>

      <button mat-button (click)='toggleHomepage()'>
        Homepage
      </button>

      <button mat-button (click)='toggleMPA()'>
        MPA
      </button>

      <button mat-button (click)='toggleProphane()'>
        Prophane
      </button>

    </div>
    <div class="spacer"></div>
    <div *ngIf="!user; else elseBlock">
      <button mat-icon-button (click)='navigateLogin()'>
        <mat-icon aria-label="account menu icon">account_circle</mat-icon>
      </button>
    </div>
    <ng-template #elseBlock>
      <button mat-icon-button (click)='navigateLogin()'>
        <img src="{{ user.photoUrl }}">
      </button>
    </ng-template>
    <span class="gap"></span>
  </mat-toolbar-row>
</mat-toolbar>
