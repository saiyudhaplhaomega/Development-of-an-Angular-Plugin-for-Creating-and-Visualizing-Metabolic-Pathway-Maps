<h3>Upload Protein database</h3>
<br>
<br>
<input type="file" #file (change)="onChange(file.files)" multiple />
<ul>
  <li *ngFor="let f of files">{{ f.name }}</li>
</ul>
<button (click)="upload()">Upload</button>
<br>
<br>
<br>
<button (click)="getProtDBs()">View List of Existing Protein Databases</button>
<ul class="protdbs">
  <li *ngFor="let protdb of this.protdbs">
    <span class="badge">{{ protdb.protdb_id }}</span>
  </li>
</ul>
