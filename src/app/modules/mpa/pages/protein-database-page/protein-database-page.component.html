<h3>Protein database page</h3>
<mat-tab-group>
  <mat-tab label="Upload protein databases">
    <h4>
      Select and upload multiple protein databases
    </h4>
    <button mat-raised-button color="primary" mat-raised-button (click)="file.click()">Choose Files</button>
    <input hidden type="file" #file (change)="onChange(file.files)" multiple />
    <ul>
      <li *ngFor="let f of files">{{ f.name }}</li>
    </ul>
    <button mat-raised-button color="primary" (click)="upload()">Upload</button>
  </mat-tab>
  <mat-tab label="View protein databases">
    <h4>
      View a list of existing protein database ids
    </h4>
    <button mat-raised-button color="primary" (click)="getProtDBs()">View List of Existing Protein Databases</button>
    <ul class="protdbs">
      <li *ngFor="let protdb of this.protdbs">
        <span class="badge">{{ protdb.protdb_id }}</span>
      </li>
    </ul>
  </mat-tab>
</mat-tab-group>
