<mat-sidenav-container fullscreen>
  <mat-sidenav #sidenav mode="push" opened role="navigation">
    <mat-nav-list>
      <a mat-list-item (click)="sidenav.toggle()" routerLink='/first'>
        <mat-icon mat-list-icon>home</mat-icon>
        Home
      </a>
      <mat-divider></mat-divider>
      <a mat-list-item (click)="sidenav.toggle()" routerLink='/modeltrainer'>
        Model training
      </a>
      <a mat-list-item (click)="sidenav.toggle()" routerLink='/neo4j'>
        Neo4J graph
      </a>
      <a mat-list-item (click)="sidenav.toggle()" routerLink='/dbsearch'>
        Database search
      </a>
      <a mat-list-item (click)="sidenav.toggle()" routerLink='/proteinloader'>
        Protein loading
      </a>
      <a mat-list-item (click)="sidenav.toggle()" routerLink='/prophane'>
        Prophane jobs
      </a>
      <mat-divider></mat-divider>
      <a mat-list-item (click)="sidenav.toggle()" routerLink='/login'>
        <mat-icon mat-list-icon>account_circle</mat-icon>
        Login
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <app-navigation-bar (toggleSidenav)="sidenav.toggle()" ></app-navigation-bar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
