<div style="margin-top: 1rem"></div>
<div cdkDropList (cdkDropListDropped)="drop($event)">
  <ng-container *ngIf="this.treeNodes !== null">
    <ng-container *ngFor='let treeNode of treeNodes'>
      <ng-container *ngIf="isVisible(treeNode)">
        <app-tree-node cdkDrag [node]='treeNode'>
        </app-tree-node>
      </ng-container>
    </ng-container>
  </ng-container>
</div>
