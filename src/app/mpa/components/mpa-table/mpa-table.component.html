<!--  Table  -->
<div class="flexbox-column protein-table">
  <div style="display: flex; justify-content: space-between">
    <p style="font-weight: 400; margin: auto 0 auto 0">Protein Groups</p>
    <mat-form-field style="width: 20%">
      <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filter">
    </mat-form-field>
  </div>
  <div style="overflow-y: auto; height: 100%" class="table-border">
    <mat-table style="width: 100%" [dataSource]="dataSource" matSort>

<!--      <ng-container matColumnDef="select">-->
<!--        <th mat-header-cell *matHeaderCellDef>-->
<!--          <mat-checkbox color="primary"-->
<!--                        (change)="$event ? masterToggle() : null"-->
<!--                        [checked]="selection.hasValue() && isAllSelected()"-->
<!--                        [indeterminate]="selection.hasValue() && !isAllSelected()">-->
<!--          </mat-checkbox>-->
<!--        </th>-->
<!--        <td mat-cell *matCellDef="let row">-->
<!--          <mat-checkbox color="primary"-->
<!--                        (click)="$event.stopPropagation()"-->
<!--                        (change)="$event ? toggleRow(row) : null"-->
<!--                        [checked]="selection.isSelected(row)">-->
<!--          </mat-checkbox>-->
<!--        </td>-->
<!--      </ng-container>-->

      <!-- Protein ID -->
      <ng-container matColumnDef="proteinGroupID">
        <mat-header-cell mat-sort-header *matHeaderCellDef >Protein Group ID</mat-header-cell>
        <mat-cell *matCellDef="let row"> {{row.proteinGroupID}} </mat-cell>
      </ng-container>

      <!-- Accession Column -->
      <ng-container matColumnDef="representativeAccession">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Accession</mat-header-cell>
        <mat-cell *matCellDef="let row"> {{row.representativeAccession}} </mat-cell>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="representativeDescription">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Description</mat-header-cell>
        <mat-cell *matCellDef="let row"> {{row.representativeDescription}} </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"
          (click)="onClick(row)"
          [ngClass]="{
          'table-highlight-row': mpaTableDataService.highlightIfSelected(row),
          'table-element-row': !mpaTableDataService.highlightIfSelected(row)
          }">
      </mat-row>

    </mat-table>
  </div>
  <mat-paginator style="background: none" [pageSizeOptions]="[5, 10, 25, 100, 1000]" showFirstLastButtons></mat-paginator>
</div>

<div class="flexbox-column">
  <cdk-accordion>
    <cdk-accordion-item
      [expanded]="true"
      #accordionItem="cdkAccordionItem"
      role="button"
      tabindex="0"
      [attr.id]="'accordion-header'"
      [attr.aria-expanded]="accordionItem.expanded"
      [attr.aria-controls]="'accordion-body'"
      class="details-accordion-item">

        <div (click)="accordionItem.toggle()" class="details-accordion-item-header">
          <p style="font-weight: 400; margin: 0">
            {{
            (accordionItem.expanded ? "displaying group " : "show details for group ") +
            mpaTableDataService.selectedProteinGroup.value.proteinGroupID
            }}
          </p>
        </div>

      <ng-container *ngIf="showDetails">
        <div class="details-accordion-item-body"
             role="region"
             [style.display]="accordionItem.expanded ? '' : 'none'"
             [attr.id]="'accordion-body'"
             [attr.aria-labelledby]="'accordion-header'">
          <app-proteingroup-detail-view class="detail-table"
            style="min-height: 0; min-width: 0; display: flex; flex-direction: column">
          </app-proteingroup-detail-view>
        </div>
      </ng-container>

    </cdk-accordion-item>
  </cdk-accordion>
</div>
