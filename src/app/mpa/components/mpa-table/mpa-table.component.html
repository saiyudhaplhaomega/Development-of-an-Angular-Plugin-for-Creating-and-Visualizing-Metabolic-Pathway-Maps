<!--  Table  -->
  <div class="flexbox-column protein-table">
    <mat-form-field style="width: 20%">
      <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filter">
    </mat-form-field>
    <div style="overflow-y: auto; height: 100%">
      <table style="width: 100%" mat-table [dataSource]="dataSource" matSort>

        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox color="primary"
                          (change)="$event ? masterToggle() : null"
                          [checked]="selection.hasValue() && isAllSelected()"
                          [indeterminate]="selection.hasValue() && !isAllSelected()">
            </mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let row">
            <mat-checkbox color="primary"
                          (click)="$event.stopPropagation()"
                          (change)="$event ? toggleRow(row) : null"
                          [checked]="selection.isSelected(row)">
            </mat-checkbox>
          </td>
        </ng-container>

        <!-- Accession Column -->
        <ng-container matColumnDef="representative_accession">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Rep. Accession</th>
          <td mat-cell *matCellDef="let row"> {{row.representative_accession}} </td>
        </ng-container>

        <!-- Description Column -->
        <ng-container matColumnDef="representative_description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Rep. Description</th>
          <td mat-cell *matCellDef="let row"> {{row.representative_description}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
<!--              <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="element-row" [cdkDetailRow]="row"-->
<!--                  [cdkDetailRowTpl]="tpl">-->
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="element-row"
            (click)="onClick(row)">
        </tr>

      </table>
    </div>
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100, 1000]" showFirstLastButtons></mat-paginator>
  </div>

  <div class="flexbox-column">
    <cdk-accordion >
      <cdk-accordion-item
        #accordionItem="cdkAccordionItem"
        role="button"
        tabindex="0"
        [attr.id]="'accordion-header'"
        [attr.aria-expanded]="accordionItem.expanded"
        [attr.aria-controls]="'accordion-body'"
        class="details-accordion-item">

        <div (click)="accordionItem.toggle()" class="details-accordion-item-header">
          <span>
            View Details of {{repAccession}} ({{ accordionItem.expanded ? 'close' : 'open' }})
          </span>
        </div>

        <div class="details-accordion-item-body"
          role="region"
          [style.display]="accordionItem.expanded ? '' : 'none'"
          [attr.id]="'accordion-body'"
          [attr.aria-labelledby]="'accordion-header'" >
          <div style="flex: 0 0 auto; display: flex; flex-direction: row">
            <p style="flex: 1 1 auto">Rep. Accession: {{repAccession}}</p>
            <p style="flex: 1 1 auto">Rep. Description: {{repDescription}}</p>
          </div>
          <app-proteingroup-detail-view [proteinGroupUUID]=proteinGroupUUID [experimentUUID]='experimentUUID'
                                        style="height: 30rem; width: 100%; min-height: 0; min-width: 0; display: flex; flex-direction: column">
          </app-proteingroup-detail-view>
        </div>
      </cdk-accordion-item>
    </cdk-accordion>
  </div>
