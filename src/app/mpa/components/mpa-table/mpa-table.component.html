<!--  Table  -->
<div class="flexbox-column protein-table">
  <mat-form-field style="width: 20%">
    <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filter">
  </mat-form-field>
  <div style="overflow-y: auto; height: 100%">
    <table style="width: 100%" mat-table [dataSource]="dataSource" matSort>

<!--      <ng-container matColumnDef="select">-->
<!--        <th mat-header-cell *matHeaderCellDef>-->
<!--          <mat-checkbox color="primary"-->
<!--                        (change)="$event ? masterToggle() : null"-->
<!--                        [checked]="selection.hasValue() && isAllSelected()"-->
<!--                        [indeterminate]="selection.hasValue() && !isAllSelected()">-->
<!--          </mat-checkbox>-->
<!--        </th>-->
<!--        <td mat-cell *matCellDef="let row">-->
<!--          <mat-checkbox color="primary"-->
<!--                        (click)="$event.stopPropagation()"-->
<!--                        (change)="$event ? toggleRow(row) : null"-->
<!--                        [checked]="selection.isSelected(row)">-->
<!--          </mat-checkbox>-->
<!--        </td>-->
<!--      </ng-container>-->

      <!-- Protein ID -->
      <ng-container matColumnDef="proteinGroupID">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Protein Group ID</th>
        <td mat-cell *matCellDef="let row"> {{row.proteinGroupID}} </td>
      </ng-container>

      <!-- Accession Column -->
      <ng-container matColumnDef="representativeAccession">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Accession</th>
        <td mat-cell *matCellDef="let row"> {{row.representativeAccession}} </td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="representativeDescription">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
        <td mat-cell *matCellDef="let row"> {{row.representativeDescription}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="element-row"
          (click)="onClick(row)"
          [ngClass]="{'table-highlight-row': mpaTableDataService.highlightIfSelected(row)}">
      </tr>

    </table>
  </div>
  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100, 1000]" showFirstLastButtons></mat-paginator>
</div>

<ng-container *ngIf="mpaTableDataService.selectedProteinGroup.value">
  <div class="flexbox-column">
    <cdk-accordion>
      <cdk-accordion-item
        #accordionItem="cdkAccordionItem"
        role="button"
        tabindex="0"
        [attr.id]="'accordion-header'"
        [attr.aria-expanded]="accordionItem.expanded"
        [attr.aria-controls]="'accordion-body'"
        class="details-accordion-item">

        <div (click)="accordionItem.toggle()" class="details-accordion-item-header">
          <span>
            Show {{ accordionItem.expanded ? 'less' : 'more' }}
          </span>
        </div>

        <div class="details-accordion-item-body"
             role="region"
             [style.display]="accordionItem.expanded ? '' : 'none'"
             [attr.id]="'accordion-body'"
             [attr.aria-labelledby]="'accordion-header'">
          <p style="flex: 0 0 auto; display: flex; flex-direction: row">{{mpaTableDataService.selectedProteinGroup.value.proteinGroupID}}</p>
          <app-proteingroup-detail-view style="height: 30rem; width: 100%; min-height: 0; min-width: 0; display: flex; flex-direction: column">
          </app-proteingroup-detail-view>
        </div>
      </cdk-accordion-item>
    </cdk-accordion>
  </div>
</ng-container>
