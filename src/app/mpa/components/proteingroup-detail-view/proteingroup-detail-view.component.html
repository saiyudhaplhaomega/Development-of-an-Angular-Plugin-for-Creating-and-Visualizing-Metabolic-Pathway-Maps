<div fxLayout="row">
  <mat-tab-group [(selectedIndex)]='tabSelectionState'>
    <mat-tab label="Proteins">
      <app-peptide-table class='peptide-detail-table' [data]='proteins'>
      </app-peptide-table>
    </mat-tab>
    <mat-tab label="Peptides">
      <app-peptide-table class='peptide-detail-table' [data]='peptides'>
      </app-peptide-table>
    </mat-tab>
    <mat-tab label="PSM"> 🧬 </mat-tab>
    <mat-tab label="Extras"> 🧬 </mat-tab>
  </mat-tab-group>
  <mat-tab-group>
    <mat-tab *ngIf='tabSelectionState==0' label="Description"></mat-tab>
    <mat-tab *ngIf='tabSelectionState==0' label="Peptide"></mat-tab>
    <mat-tab *ngIf='tabSelectionState!=2' label="PSM"> 🧬 </mat-tab>
    <mat-tab *ngIf='tabSelectionState==0' label="Sequence"> 🧬 </mat-tab>
    <mat-tab *ngIf='tabSelectionState==2' label="Spectrum"></mat-tab>
  </mat-tab-group>
</div>
