

<div class="ml-5 mr-5">
  <div class="input-group justify-content-center col-md-4 col-md-offset-4">
    <input id="currentUrl" type="text" class="form-control input-monospace input-sm bg-gray-light"
           data-autoselect="" value="{{ url }}" readonly="">
    <button (click)="copyToClipboard()">copy</button>
  </div>
  <table class="table table-striped jobcontrol">
    <thead>
    <tr>
      <th scope="col">job label</th>
      <th scope="col">creation time</th>
      <th scope="col">status</th>
      <th scope="col">results</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngIf="job == undefined || job == null">
      <td colspan="4">
        <span class="spinner-border spinner-border-sm ml-2 bg-white" role="status" aria-hidden="true"></span>
        Loading...
      </td>
    </tr>
    <tr *ngIf="job != undefined && job != null">
      <td>
        {{ job.parameters.jobLabel }}
      </td>
      <td>
        {{ job.creationdate }}
      </td>
      <td>
        {{ job.statusmessage }}
      </td>
      <td>
        <span *ngIf="job.downloadURL != ''">
          <a href="{{ job.downloadURL }}">Download</a>
        </span>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<div>
  <object type="text/html" [data]=" getKronaUrl(1) | safe " width="800px" height="600px" style="overflow:auto">
  </object>
</div>
