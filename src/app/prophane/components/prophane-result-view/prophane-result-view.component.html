

<div class="ml-5 mr-5">
  <div class="input-group justify-content-center">
    <input type= "url" id="currentUrl" type="text" class="form-control"
           data-autoselect="" value="{{ url }}" readonly="">
      <button mat-raised-button color="primary" (click)="copyToClipboard()">copy url</button>
  </div>
  <p></p>
  <table class="table table-striped jobcontrol">
    <thead>
    <tr>
      <th scope="col">job label</th>
      <th scope="col">creation time</th>
      <th scope="col">status</th>
      <th scope="col">results</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngIf="job == undefined || job == null">
      <td colspan="4">
        <span class="spinner-border spinner-border-sm ml-2 bg-white" role="status" aria-hidden="true"></span>
        Loading...
      </td>
    </tr>
    <tr *ngIf="job != undefined && job != null">
      <td>
        {{ job.parameters.jobLabel }}
      </td>
      <td>
        {{ job.parameters.annotationTasks[0].tasklabel}}
      </td>
      <td>
        {{ job.creationdate }}
      </td>
      <td>
        {{ job.statusmessage }}
      </td>
      <td>
        <span *ngIf="job.downloadURL != ''">
          <a href="{{ job.downloadURL }}">Download</a>
        </span>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<p></p>
<p></p>

<app-side-bar-results></app-side-bar-results>
