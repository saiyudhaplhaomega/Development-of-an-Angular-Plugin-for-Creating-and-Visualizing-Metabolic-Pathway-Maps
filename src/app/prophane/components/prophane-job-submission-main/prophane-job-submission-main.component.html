<div fxFlex class="bg-white">

  <div *ngIf="jobUnavailable" class="align-content-center mb-2 alert-danger">
    {{this.jobUnavailableMessage}}
  </div>

  <div class="d-flex justify-content-between">
    <app-job-stepper
      [expertView]="expertView"
      [jobLabelData]="stepperLabels"
      [resetStepper]="resetStepper.asObservable()"
      (currentStepLabel)="setCurrentStep($event)">
    </app-job-stepper>

    <div class="jobCards">
      <div class="card w-50 ml-job-form min-w-600">
        <div class="card-header">
          <h5>
            {{currentStepLabel}}
            <span class="card-title-button-wrapper" *ngIf="authGuard.allowExpert()">
              <mat-slide-toggle color (change)="onViewChange()">expert</mat-slide-toggle>
            </span>
          </h5>
        </div>

        <div class="card-body">
          <app-job-input
            *ngIf="currentStepLabel === 'Input'"
            [prophaneJob]="prophaneJobState.currentProphaneJob"
            (sourceChangeEvent)="onSourceChange()">
          </app-job-input>
        </div>

      </div>
    </div>
  </div>

</div>
